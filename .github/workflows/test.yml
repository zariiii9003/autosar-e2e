name: Tests

on:
  pull_request:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: read

env:
  PY_COLORS: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        env: [
          "py38",
          "py39",
          "py310",
          "py311",
          "py312",
          "py313",
          "py314",
          "py313t",
          "py314t",
          "pypy310",
          "pypy311",
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # 8.1.0
        with:
          enable-cache: false
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Test with pytest via tox
        run: |
          tox -e ${{ matrix.env }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # 8.1.0
        with:
          enable-cache: false
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Build documentation
        run: |
          tox -e doc

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # 8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        run: |
          uv tool install pre-commit --with pre-commit-uv
          pre-commit install
      - name: Check pre-commit
        run: |
          pre-commit run -a
