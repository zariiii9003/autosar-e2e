name: Tests

on:
  pull_request:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: read

env:
  PY_COLORS: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        env: [
          "py38",
          "py39",
          "py310",
          "py311",
          "py312",
          "py313",
          "py314",
          "py313t",
          "py314t",
          "pypy310",
          "pypy311",
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # 7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          enable-cache: false
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Test with pytest via tox
        run: |
          tox -e ${{ matrix.env }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # 7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          enable-cache: false
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Build documentation
        run: |
          tox -e doc

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # 7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          enable-cache: false
      - name: Install dependencies
        run: |
          uv tool install pre-commit --with pre-commit-uv
          pre-commit install
      - name: Check pre-commit
        run: |
          pre-commit run -a
